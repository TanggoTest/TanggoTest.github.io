<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffdb70;
  --bg2: #fff4b6;
  --bg3: #1a1a24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #000000;
  --text2: rgba(0, 0, 0, 0.55);
  --text3: rgba(0, 0, 0, 0.3);
  --blue-main: #4a9eff;
  --blue-main-light: rgba(74,158,255,0.15);
  --blue-main-glow: rgba(74,158,255,0.3);
  --teal: #0ecfaa;
  --teal-light: rgba(14,207,170,0.12);
  --pink: #f06292;
  --pink-light: rgba(240,98,146,0.12);
  --amber: #fbbf24;
  --amber-light: rgba(251,191,36,0.12);
  --coral: #ff6b6b;
  --coral-light: rgba(255,107,107,0.12);
  --blue: #60a5fa;
  --blue-light: rgba(96,165,250,0.12);
  --green: #4ade80;
  --green-light: rgba(74,222,128,0.12);
  --red: #f87171;
  --red-light: rgba(248,113,113,0.12);
  --radius: 12px;
  --radius-sm: 9px;
  --radius-pill: 900px;
  --font-display: 'times new roman', timesnewroman;
  --font-mono: 'Space Mono', monospace;
}

html { scroll-behavior: smooth; }
body { font-family: var(--font-mono); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* NAV */
nav {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px;
  background: rgba(12,12,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.nav-brand {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--blue-main), #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-tag {
  font-size: 10px; font-family: var(--font-mono);
  background: var(--blue-main-light); color: var(--blue-main);
  border: 1px solid var(--blue-main-glow);
  padding: 2px 8px; border-radius: var(--radius-pill);
  -webkit-text-fill-color: var(--blue-main);
  font-weight: 400; letter-spacing: 0.05em;
}
.nav-links { display: flex; gap: 2px; flex: 1; }
.nav-btn {
  background: none; border: none;
  padding: 7px 14px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px; font-family: var(--font-mono);
  color: var(--text2); letter-spacing: 0.03em;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-btn.active { color: var(--blue-main); background: var(--blue-main-light); }

/* HERO */
.hero {
  padding: 80px 28px 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero h1 {
  font-family: 'Times New Roman', Times, serif;
  font-size: 60px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -2px;
  margin-bottom: 16px;
}
.hero h1 .line2 {
  background: black;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-sub { font-size: 14px; color: var(--text2); margin-bottom: 36px; line-height: 1.7; }

/* SEARCH */
.search-wrap { position: relative; max-width: 580px; margin: 0 auto; }
.search-input {
  width: 100%;
  padding: 16px 52px 16px 20px;
  font-size: 15px; font-family: var(--font-mono);
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--blue-main); box-shadow: 0 0 0 3px var(--blue-main-glow); }
.search-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; pointer-events: none; }
.autocomplete {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius); z-index: 300; overflow: hidden; display: none;
}
.autocomplete.show { display: block; }
.auto-item {
  padding: 12px 16px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.auto-item:last-child { border-bottom: none; }
.auto-item:hover { background: rgba(255,255,255,0.04); }
.auto-term { flex: 1; font-weight: 700; }
.auto-badge { font-size: 10px; padding: 3px 9px; border-radius: var(--radius-pill); letter-spacing: 0.05em; }

/* CATEGORIES */
.section { padding: 0 28px 48px; }
.section-sm { padding: 0 28px 32px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.see-all { font-size: 12px; color: var(--blue-main); cursor: pointer; background: none; border: none; font-family: var(--font-mono); letter-spacing: 0.05em; }
.see-all:hover { text-decoration: underline; }

.cat-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 48px; padding: 0 28px; }
.cat-pill {
  border: 1px solid var(--border2);
  background: var(--bg2);
  padding: 9px 18px; border-radius: var(--radius-pill);
  cursor: pointer; font-size: 12px; font-family: var(--font-mono);
  color: var(--text2); display: flex; align-items: center; gap: 8px;
  transition: all 0.2s; letter-spacing: 0.03em;
}
.cat-pill:hover { border-color: var(--blue-main); color: var(--text); }
.cat-pill.active { border-color: var(--blue-main); background: var(--blue-main-light); color: var(--blue-main); }

/* WORD CARDS */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.word-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  cursor: pointer; transition: border-color 0.2s, transform 0.15s, background 0.2s;
  position: relative; overflow: hidden;
}
.word-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--blue-main-light), transparent);
  opacity: 0; transition: opacity 0.2s;
}
.word-card:hover { border-color: var(--border2); transform: translateY(-2px); background: whitesmoke; }
.word-card:hover::after { opacity: 1; }
.word-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; position: relative; z-index: 1; }
.word-term { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.trend-chip { font-size: 10px; background: var(--teal-light); color: var(--teal); border: 1px solid rgba(14,207,170,0.2); padding: 3px 8px; border-radius: var(--radius-pill); letter-spacing: 0.05em; flex-shrink: 0; }
.word-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; position: relative; z-index: 1; }
.tag { font-size: 10px; padding: 3px 9px; border-radius: var(--radius-pill); letter-spacing: 0.05em; border: 1px solid transparent; }
.word-def { font-size: 12px; color: var(--text2); line-height: 1.6; position: relative; z-index: 1; }
.heat-bar { height: 2px; background: rgba(255,255,255,0.06); border-radius: 1px; margin-top: 14px; overflow: hidden; position: relative; z-index: 1; }
.heat-fill { height: 100%; border-radius: 1px; }

/* DETAIL PAGE */
.detail-wrap { padding: 28px; max-width: 760px; margin: 0 auto; }
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  border: none; background: none; font-family: var(--font-mono);
  margin-bottom: 32px; padding: 0; letter-spacing: 0.03em;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--text); }
.detail-word { font-family: var(--font-display); font-size: clamp(36px, 6vw, 56px); font-weight: 800; letter-spacing: -2px; margin-bottom: 12px; }
.detail-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.detail-pronun { font-size: 15px; color: var(--text3); margin-bottom: 28px; }
.detail-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px;
}
.detail-label {
  font-size: 10px; color: var(--blue-main); letter-spacing: 0.12em;
  text-transform: uppercase; margin-bottom: 10px; font-family: var(--font-mono);
}
.detail-content { font-size: 14px; line-height: 1.75; color: var(--text); }
.example-item { display: flex; gap: 12px; margin-bottom: 10px; font-size: 13px; }
.ex-num { color: var(--blue-main); font-size: 10px; margin-top: 5px; flex-shrink: 0; }
.similar-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.similar-chip {
  padding: 7px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--border2); background: var(--bg3);
  font-size: 12px; cursor: pointer; font-family: var(--font-mono);
  color: whitesmoke; transition: all 0.15s;
}
.similar-chip:hover { border-color: var(--blue-main); color: var(--blue-main); background: var(--blue-main-light); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }
.heat-big-bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
.heat-big-fill { height: 100%; border-radius: 3px; }

/* BROWSE */
.browse-wrap { padding: 28px; }
.browse-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.filter-chip {
  padding: 7px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: none;
  font-size: 11px; cursor: pointer; font-family: var(--font-mono);
  color: var(--text2); letter-spacing: 0.05em; transition: all 0.15s;
}
.filter-chip.active {color: #fff; border-color: var(--blue-main); }
.filter-chip:hover:not(.active) { border-color: var(--border2); color: var(--text); }

/* SEARCH RESULTS */
.results-bar { padding: 0 28px 16px; font-size: 12px; color: var(--text3); letter-spacing: 0.03em; }
.results-grid { padding: 0 28px 48px; }

/* MISC */
.divider { height: 1px; background: var(--border); margin: 0 28px 40px; }
.empty-state { text-align: center; padding: 56px 24px; color: var(--text3); font-size: 13px; }

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.word-card { animation: fadeUp 0.3s ease both; }
.word-card:nth-child(2) { animation-delay: 0.04s; }
.word-card:nth-child(3) { animation-delay: 0.08s; }
.word-card:nth-child(4) { animation-delay: 0.12s; }
.word-card:nth-child(5) { animation-delay: 0.16s; }
.word-card:nth-child(6) { animation-delay: 0.20s; }

/* PLAY NAV BUTTON */
.play-nav-btn {
  color: var(--blue-main) !important;
  border: 1px solid var(--blue-main-glow);
  background: var(--blue-main-light) !important;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.play-nav-btn:hover { background: rgba(74,158,255,0.25) !important; }


/* GAME MODAL */
.game-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  align-items: center; justify-content: center;
}
.game-overlay.show { display: flex; }
.game-modal {
  background: #fff8d6; border: 1px solid var(--border2);
  border-radius: 18px; padding: 36px 32px; max-width: 520px; width: 90%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.35);
  position: relative; animation: fadeUp 0.25s ease both;
}
.game-close {
  position: absolute; top: 16px; right: 18px;
  background: none; border: none; font-size: 20px; cursor: pointer;
  color: var(--text3); line-height: 1;
}
.game-close:hover { color: var(--text); }
.game-label {
  font-size: 10px; color: var(--blue-main); letter-spacing: 0.14em;
  text-transform: uppercase; font-family: var(--font-mono); margin-bottom: 14px;
}
.game-score-row {
  display: flex; gap: 16px; margin-bottom: 20px; font-size: 12px;
  color: var(--text2); font-family: var(--font-mono);
}
.game-score-row b { color: var(--text); }
.game-def-card {
  background: var(--bg3); border-radius: var(--radius); padding: 20px 22px;
  margin-bottom: 20px; color: #eee; font-size: 14px; line-height: 1.75;
  border: 1px solid var(--border2);
}
.game-examples {
  font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 12px;
  line-height: 1.7;
}
.game-input-row { display: flex; gap: 10px; margin-bottom: 14px; }
.game-input {
  flex: 1; padding: 12px 16px; font-size: 14px;
  font-family: var(--font-mono); border-radius: var(--radius-sm);
  border: 1px solid var(--border2); background: #fffbe8; color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.game-input:focus { border-color: var(--blue-main); box-shadow: 0 0 0 3px var(--blue-main-glow); }
.game-submit {
  padding: 12px 22px; border-radius: var(--radius-sm);
  background: var(--blue-main); color: #fff; border: none;
  font-family: var(--font-mono); font-size: 13px; cursor: pointer;
  transition: opacity 0.15s; font-weight: 700; letter-spacing: 0.04em;
}
.game-submit:hover { opacity: 0.85; }
.game-feedback {
  font-size: 13px; min-height: 22px; text-align: center;
  font-family: var(--font-mono); letter-spacing: 0.04em; margin-bottom: 10px;
  font-weight: 700;
}
.game-feedback.correct { color: #0ecfaa; }
.game-feedback.wrong { color: #f87171; }
.game-hint {
  font-size: 11px; color: var(--text3); text-align: center;
  margin-bottom: 14px; font-family: var(--font-mono);
}
.game-actions { display: flex; gap: 10px; justify-content: center; }
.game-skip {
  padding: 9px 20px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2); background: none; color: var(--text2);
  font-family: var(--font-mono); font-size: 12px; cursor: pointer;
  transition: all 0.15s;
}
.game-skip:hover { color: var(--text); background: rgba(0,0,0,0.05); }
.game-reveal {
  padding: 9px 20px; border-radius: var(--radius-sm);
  border: 1px solid var(--amber); background: rgba(251,191,36,0.12); color: #b8860b;
  font-family: var(--font-mono); font-size: 12px; cursor: pointer;
  transition: all 0.15s;
}
.game-reveal:hover { background: rgba(251,191,36,0.22); }
</style>
</head>
<body>

<!-- GAME MODAL -->
<div class="game-overlay" id="gameOverlay" onclick="handleOverlayClick(event)">
  <div class="game-modal">
    <button class="game-close" onclick="closeGame()" aria-label="Close">✕</button>
    <div class="game-label">🎮 Guess the Slang</div>
    <div class="game-score-row">

    <div class="game-def-card">

      <div class="game-examples" id="gameExamples"></div>

    <div class="game-input-row">
      <input class="game-input" type="text" id="gameInput" placeholder="Type the slang word…" onkeydown="if(event.key==='Enter') submitGuess()" autocomplete="off" />

    </div>
    <div class="game-feedback" id="gameFeedback"></div>

</div>

<nav>

<!-- HOME PAGE -->

<script>
const CATS = { tiktok:'TikTok', gaming:'Gaming', internet:'Internet', dating:'Dating', meme:'Meme', business:'Business' };
const CAT_COLORS = {
  tiktok:  { bg:'rgba(74,158,255,0.15)', color:'#7ec8ff', border:'rgba(74,158,255,0.3)' },
  gaming:  { bg:'rgba(14,207,170,0.12)', color:'#0ecfaa', border:'rgba(14,207,170,0.25)' },

function tagStyle(c) {
  const s = c || {};
  return `background:${s.bg||'rgba(255,255,255,0.07)'};color:${s.color||'rgba(255,255,255,0.5)'};border:1px solid ${s.border||'rgba(255,255,255,0.12)'}`;
}

function makeCard(s) {
  const cc = CAT_COLORS[s.cat] || {};
  const rc = REG_COLORS[s.register] || {};
  const catLabel = CATS[s.cat] || s.cat;
  return `<div class="word-card" onclick="showDetail(${s.id})" role="button" tabindex="0" aria-label="View definition of ${s.term}">
    <div class="word-card-top">
      <span class="word-term">${s.term}</span>
      ${s.trending ? '<span class="trend-chip">Trending</span>' : ''}
    </div>
    <div class="word-tags">
      <span class="tag" style="${tagStyle(cc)}">${catLabel}</span>
      <span class="tag" style="${tagStyle(rc)}">${s.register}</span>
    </div>
    <div class="word-def">${s.def.slice(0,95)}${s.def.length>95?'…':''}</div>
    <div class="heat-bar"><div class="heat-fill" style="width:${s.heat}%;background:${heatColor(s.heat)}"></div></div>
  </div>`;
}

function renderGrid(id, items) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = items.length ? items.map(makeCard).join('') : '<div class="empty-state">No entries found.</div>';
}

function init() {
  renderGrid('trendingGrid', SLANG.filter(s => s.trending).slice(0, 6));
  renderGrid('recentGrid', [...SLANG].sort((a,b) => b.id - a.id).slice(0, 6));
  renderGrid('browseGrid', SLANG);
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  window.scrollTo(0, 0);
}

function setActiveNav(key) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (key) {
    const btn = document.getElementById('nav-' + key);
    if (btn) btn.classList.add('active');
  }
}

function filterCategory(cat, btn) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = cat === 'all' ? SLANG : SLANG.filter(s => s.cat === cat);
  renderGrid('trendingGrid', filtered.filter(s => s.trending).slice(0, 6));
  renderGrid('recentGrid', [...filtered].sort((a,b) => b.id - a.id).slice(0, 6));
}

function browseFilter(f, btn) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = f === 'all' ? SLANG : SLANG.filter(s => s.cat === f || s.register === f);
  renderGrid('browseGrid', filtered);
}

function handleSearch(val) {
  const q = val.trim().toLowerCase();
  const ac = document.getElementById('autocomplete');
  const sa = document.getElementById('searchResultsArea');
  const ta = document.getElementById('trendingArea');

  if (!q) {
    ac.classList.remove('show');
    sa.style.display = 'none';
    ta.style.display = '';
    return;
  }

  const matches = SLANG.filter(s =>
    s.term.toLowerCase().includes(q) ||
    s.def.toLowerCase().includes(q) ||
    s.similar.some(w => w.toLowerCase().includes(q))
  );

  if (val.length > 1 && matches.length) {
    ac.innerHTML = matches.slice(0, 5).map(s => {
      const cc = CAT_COLORS[s.cat] || {};
      return `<div class="auto-item" role="option" onclick="showDetail(${s.id}); document.getElementById('heroSearch').value=''; document.getElementById('autocomplete').classList.remove('show')">
        <span style="color:var(--text3);font-size:14px">○</span>
        <span class="auto-term">${s.term}</span>
        <span class="auto-badge" style="${tagStyle(cc)}">${CATS[s.cat]||s.cat}</span>
      </div>`;
    }).join('');
    ac.classList.add('show');
  } else {
    ac.classList.remove('show');
  }

  ta.style.display = 'none';
  sa.style.display = '';
  document.getElementById('resultsCount').textContent = `${matches.length} result${matches.length !== 1 ? 's' : ''} for "${val}"`;
  renderGrid('searchGrid', matches);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('autocomplete').classList.remove('show');
  }
});

function showDetail(id) {
  const s = SLANG.find(x => x.id === id);
  if (!s) return;
  const cc = CAT_COLORS[s.cat] || {};
  const rc = REG_COLORS[s.register] || {};
  const catLabel = CATS[s.cat] || s.cat;

  document.getElementById('detailContent').innerHTML = `
    <button class="back-btn" onclick="showPage('home'); setActiveNav('home')">← Back</button>
    <div class="detail-word">${s.term}</div>
    <div class="detail-meta">
      <span class="tag" style="${tagStyle(cc)};font-size:12px;padding:5px 12px">${catLabel}</span>
      <span class="tag" style="${tagStyle(rc)};font-size:12px;padding:5px 12px">${s.register}</span>
      ${s.trending ? '<span class="tag" style="background:rgba(14,207,170,0.12);color:var(--teal);border:1px solid rgba(14,207,170,0.25);font-size:12px;padding:5px 12px">🔥 trending</span>' : ''}
    </div>
    <div class="detail-pronun">${s.pronun}</div>
    <div class="detail-card">
      <div class="detail-label">Definition</div>
      <div class="detail-content">${s.def}</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Usage examples</div>
      ${s.examples.map((ex, i) => `<div class="example-item"><span class="ex-num">0${i+1}</span><span>${ex}</span></div>`).join('')}
    </div>
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-label">Origin</div>
        <div class="detail-content" style="font-size:13px">${s.origin}</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">Popularity score</div>
        <div class="heat-big-bar"><div class="heat-big-fill" style="width:${s.heat}%;background:${heatColor(s.heat)}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px"><span>0</span><span style="font-size:18px;font-family:var(--font-display);font-weight:700;color:var(--text)">${s.heat}</span><span>100</span></div>
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Similar slang</div>
      <div class="similar-chips">
        ${s.similar.map(w => `<button class="similar-chip" onclick="searchSimilar('${w}')">${w}</button>`).join('')}
      </div>
    </div>`;

  showPage('detail');
}

function searchSimilar(word) {
  const found = SLANG.find(s => s.term.toLowerCase() === word.toLowerCase());
  if (found) { showDetail(found.id); return; }
  document.getElementById('heroSearch').value = word;
  showPage('home');
  setActiveNav('home');
  handleSearch(word);
}
// ── GAME ──────────────────────────────────────────────────────────────────
let gameState = { current: null, score: 0, streak: 0, round: 1, revealed: false };

function startGame() {
  gameState = { current: null, score: 0, streak: 0, round: 1, revealed: false };
  updateScoreUI();
  pickRound();
  document.getElementById('gameOverlay').classList.add('show');
  setTimeout(() => document.getElementById('gameInput').focus(), 80);
}

function closeGame() {
  document.getElementById('gameOverlay').classList.remove('show');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('gameOverlay')) closeGame();
}

function pickRound() {
  const s = SLANG[Math.floor(Math.random() * SLANG.length)];
  gameState.current = s;
  gameState.revealed = false;
  document.getElementById('gameDef').textContent = s.def;
  document.getElementById('gameExamples').innerHTML = '';
  document.getElementById('gameInput').value = '';
  document.getElementById('gameFeedback').textContent = '';
  document.getElementById('gameFeedback').className = 'game-feedback';
  document.getElementById('gameHint').textContent =
    `Hint: ${s.term.length} letters · starts with "${s.term[0].toUpperCase()}"`;
  setTimeout(() => document.getElementById('gameInput').focus(), 40);
}

function submitGuess() {
  if (gameState.revealed) { nextRound(); return; }
  const val = document.getElementById('gameInput').value.trim();
  if (!val) return;
  const correct = val.toLowerCase() === gameState.current.term.toLowerCase();
  const fb = document.getElementById('gameFeedback');
  if (correct) {
    gameState.score += 10 + gameState.streak * 2;
    gameState.streak++;
    fb.textContent = `✓ Correct! +${10 + (gameState.streak - 1) * 2} pts`;
    fb.className = 'game-feedback correct';
    updateScoreUI();
    setTimeout(() => nextRound(), 1100);
  } else {
    gameState.streak = 0;
    fb.textContent = `✗ Not quite — try again!`;
    fb.className = 'game-feedback wrong';
    updateScoreUI();
  }
}

function revealAnswer() {
  if (gameState.revealed) return;
  gameState.revealed = true;
  gameState.streak = 0;
  updateScoreUI();
  const fb = document.getElementById('gameFeedback');
  fb.textContent = `The answer was: ${gameState.current.term}`;
  fb.className = 'game-feedback wrong';
  document.getElementById('gameInput').value = gameState.current.term;
}

function nextRound() {
  gameState.round++;
  document.getElementById('gameRound').textContent = gameState.round;
  pickRound();
}

function updateScoreUI() {
  document.getElementById('gameScore').textContent = gameState.score;
  document.getElementById('gameStreak').textContent = gameState.streak;
}

// ── END GAME ───────────────────────────────────────────────────────────────
init();
</script>
